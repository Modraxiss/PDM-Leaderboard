<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDM Leaderboard</title>

    <meta name="description"
        content="The PDM Leaderboard is a dedicated platform for real-time tracking of player standings in Starblast.io's 'Pro Deathmatch' mod. It provides up-to-date rankings across multiple regions, allowing players to monitor their progress and compete at the highest level.">
    <meta name="author" content="Modraxis (aka Basit)">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://modraxiss.github.io/PDM-Leaderboard/">
    <meta property="og:title" content="PDM Leaderboard">
    <meta property="og:description"
        content="Track your real-time rankings in Starblast.io's 'Pro Deathmatch' mod with the PDM Leaderboard.">
    <meta property="og:image" content="https://modraxiss.github.io/PDM-Leaderboard/assets/preview.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://modraxiss.github.io/PDM-Leaderboard/">
    <meta name="twitter:title" content="PDM Leaderboard">
    <meta name="twitter:description"
        content="Track your real-time rankings in Starblast.io's 'Pro Deathmatch' mod with the PDM Leaderboard.">
    <meta name="twitter:image" content="https://modraxiss.github.io/PDM-Leaderboard/assets/preview.png">


    <link rel="shortcut icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="./CSS/fonts.css">
    <link rel="stylesheet" href="./CSS/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-overlay"><i class="sb-icon i-00be"></i></div>
    <header>
        <h1>
            <i class="sb-icon i-002e text-glow no-select"
                style="margin-right: 16px;color: gold;transform: rotate(-5deg);"></i>
            Pro Deathmatch
            <i class="sb-icon i-002e text-glow no-select"
                style="margin-left: 16px;color: gold;transform: rotate(5deg);"></i>
        </h1>

        <span class="options no-select">
            <i class="bi bi-list icon"></i>
            <div class="menu">
                <h3 class="header">Options</h3>
                <div class="option">
                    <label for="showBlankBadges">Show Blank-Badges</label>
                    <label class="switch">
                        <input type="checkbox" id="showBlankBadges">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </span>
    </header>

    <main>
        <div class="region-switch no-select">
            <button class="region-btn active" data-region="Asia">Asia</button>
            <button class="region-btn" data-region="Europe">Europe</button>
            <button class="region-btn" data-region="America">America</button>
        </div>

        <div class="leaderboard">
            <div class="leaderboard-header no-select">
                <div class="playerName">Player</div>
                <div class="status">
                    <div>Live Rank</div>
                    <div>Live Score</div>
                </div>
            </div>

            <div id="leaderboard-body">
                <div class="loading"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="link no-select">
            <a href="https://github.com/Modraxiss/PDM-Leaderboard" target="_blank">
                <i class="bi bi-github"></i>
                REPO
            </a>
        </div>
        <div>
            &copy;
            2024-2025 - Modraxis (aka <glow>Basit</glow>)
        </div>
        <div class="link no-select">
            <a href="https://discord.gg/5KzPdSYNqx" target="_blank">
                <i class="sb-icon i-007b"></i>
                Discord
            </a>
        </div>
    </footer>

    <script type="text/javascript" src="./JS/ecpicon.js"></script>
    <script type="text/javascript" src="./JS/main.js"></script>
</body>

</html>
